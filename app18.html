<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Formatter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: #1e1e1e;
        }

        .header {
            background: #2d2d30;
            color: #fff;
            padding: 15px 20px;
            text-align: center;
            border-bottom: 2px solid #007acc;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 500;
        }

        .container {
            display: flex;
            height: calc(100vh - 60px);
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .panel-title {
            color: #d4d4d4;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        textarea {
            flex: 1;
            background: #252526;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            color: #d4d4d4;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            padding: 15px;
            resize: none;
            outline: none;
            line-height: 1.6;
        }

        textarea:focus {
            border-color: #007acc;
        }

        #input {
            color: #ce9178;
        }

        #output {
            color: #4ec9b0;
        }

        .divider {
            width: 2px;
            background: #3e3e42;
        }

        .error {
            background: #5a1d1d;
            border: 1px solid #f48771;
            border-radius: 4px;
            color: #f48771;
            padding: 10px;
            margin-top: 10px;
            font-size: 13px;
            display: none;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            background: #007acc;
            border: none;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.2s;
        }

        button:hover {
            background: #005a9e;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: #3e3e42;
        }

        .btn-secondary:hover {
            background: #505050;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            
            .divider {
                width: 100%;
                height: 2px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>JSON Formatter</h1>
    </div>

    <div class="container">
        <div class="panel">
            <div class="panel-title">Input</div>
            <textarea id="input" placeholder='Paste your JSON here...'></textarea>
            <div id="error" class="error"></div>
            <div class="controls">
                <button onclick="formatJSON()">Format</button>
                <button class="btn-secondary" onclick="clearAll()">Clear</button>
            </div>
        </div>

        <div class="divider"></div>

        <div class="panel">
            <div class="panel-title">Output</div>
            <textarea id="output" readonly placeholder='Formatted JSON will appear here...'></textarea>
            <div class="controls">
                <button onclick="copyToClipboard()">Copy</button>
                <button class="btn-secondary" onclick="minifyJSON()">Minify</button>
            </div>
        </div>
    </div>

    <script>
        const inputEl = document.getElementById('input');
        const outputEl = document.getElementById('output');
        const errorEl = document.getElementById('error');

        // Auto-format on input
        inputEl.addEventListener('input', formatJSON);

        function formatJSON() {
            try {
                let input = inputEl.value.trim();
                
                if (!input) {
                    outputEl.value = '';
                    hideError();
                    return;
                }

                // Clean the input: replace escape sequences
                input = input
                    .replace(/\\n/g, '')
                    .replace(/\\r/g, '')
                    .replace(/\\t/g, '')
                    .replace(/\\\\/g, '\\');

                // Parse and beautify
                const parsed = JSON.parse(input);
                const beautified = JSON.stringify(parsed, null, 2);
                
                outputEl.value = beautified;
                hideError();
            } catch (error) {
                showError('Invalid JSON: ' + error.message);
            }
        }

        function minifyJSON() {
            try {
                const input = outputEl.value.trim();
                if (!input) return;

                const parsed = JSON.parse(input);
                outputEl.value = JSON.stringify(parsed);
                hideError();
            } catch (error) {
                showError('Cannot minify: ' + error.message);
            }
        }

        function copyToClipboard() {
            if (!outputEl.value) {
                showError('Nothing to copy');
                return;
            }

            outputEl.select();
            document.execCommand('copy');
            
            // Visual feedback
            const btn = event.target;
            const originalText = btn.textContent;
            btn.textContent = 'Copied!';
            setTimeout(() => {
                btn.textContent = originalText;
            }, 1500);
        }

        function clearAll() {
            inputEl.value = '';
            outputEl.value = '';
            hideError();
        }

        function showError(message) {
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }

        function hideError() {
            errorEl.style.display = 'none';
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Ctrl/Cmd + Enter to format
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                formatJSON();
            }
            // Ctrl/Cmd + K to clear
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                clearAll();
            }
        });
    </script>
</body>
</html>
